<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101410"><title>NFL Live Bet Tracker v2</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>NFL LIVE BET TRACKER · V2</small><h1>Game Day Board</h1><p id="stamp">Loading tickets…</p></div><button id="openAdd">📷 Add Bet</button></header><section class="stats"><div><b id="risk">—</b><span>OPEN CASH RISK</span></div><div><b id="return">—</b><span>MAX RETURN</span></div><div><b id="count">—</b><span>TICKETS</span></div></section><section id="bets"></section><dialog id="dlg"><form id="form"><div class="dlghead"><h2>Add Bet</h2><button type="button" id="close">×</button></div><label class="photo">📷 Take / Choose Screenshot<input id="shot" type="file" accept="image/*" capture="environment"></label><p id="photoMsg">Screenshot selection is ready. Automatic parsing is the next isolated feature; review fields below before saving.</p><div class="grid"><label>Sportsbook<input name="sportsbook" value="DraftKings" required></label><label>Game<input name="game" placeholder="DET @ BUF" required></label><label>Wager<input name="wager" type="number" min="0" step=".01" required></label><label>To pay<input name="payout" type="number" min="0" step=".01" required></label><label>Odds<input name="odds" placeholder="+1200"></label><label>Promo<input name="promo" placeholder="Bonus / boost"></label></div><label>Legs — one per line<textarea name="legs" rows="7" required></textarea></label><button class="save" type="submit">Review & Add to Tracker</button><p id="msg"></p></form></dialog></main><script src="/app.js"></script></body></html>
