<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101410"><title>NFL Live Bet Tracker v2</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>NFL LIVE BET TRACKER · V2</small><h1>Game Day Board</h1><p id="stamp">Loading tickets…</p></div><button id="openAdd">📷 Add Bet</button></header><section class="stats"><div><b id="risk">—</b><span>OPEN CASH RISK</span></div><div><b id="return">—</b><span>MAX RETURN</span></div><div><b id="count">—</b><span>TICKETS</span></div></section><nav class="betFilters" aria-label="Bet status"><button type="button" data-filter="LIVE" class="active">Live Bets</button><button type="button" data-filter="SETTLED">Settled</button><button type="button" data-filter="ALL">All</button></nav><section id="bets"></section><dialog id="dlg"><form id="form"><div class="dlghead"><h2>Add Bet</h2><button type="button" id="close">×</button></div><div class="photoActions"><label class="photo">📷 Take a Picture<input id="cameraShot" type="file" accept="image/*" capture="environment"></label><label class="photo secondary">🖼️ Add a Picture<input id="galleryShot" type="file" accept="image/*"></label></div><div id="previewWrap" hidden><img id="shotPreview" alt="Selected bet screenshot"></div><p id="photoMsg">Take a new photo or add an existing DraftKings screenshot. The image will be saved with the bet; verify the fields below before saving.</p><div class="grid"><label>Sportsbook<input name="sportsbook" value="DraftKings" required></label><label>Game<input name="game" placeholder="DET @ BUF" required></label><label>Wager<input name="wager" type="number" min="0" step=".01" required></label><label>To pay<input name="payout" type="number" min="0" step=".01" required></label><label>Odds<input name="odds" placeholder="+1200"></label><label>Promo<input name="promo" placeholder="Bonus / boost"></label></div><label>Legs — one per line<textarea name="legs" rows="7" required></textarea></label><button class="save" type="submit">Review & Add to Tracker</button><p id="msg"></p></form></dialog></main><script src="/app.js"></script></body></html>
